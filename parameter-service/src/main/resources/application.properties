spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false

server.port=8082

jasypt.encryptor.password=${JASYPT_ENCRYPTION_PASSWORD:}

logging.file.name=logs/parameter.log

# Root logging level
logging.level.root=INFO

# Application logging level
logging.level.com.empay=DEBUG

# Request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Log file rolling configuration
logging.logback.rollingpolicy.file-name-pattern=logs/%d{yyyy-MM}/parameter-%d{yyyy-MM-dd}.%i.log.gz

# Maximum file size
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=50
logging.logback.rollingpolicy.total-size-cap=1GB

